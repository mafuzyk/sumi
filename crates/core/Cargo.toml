[package]
name = "sumi-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The native Sumi canvas session, painting engine integration and renderer state"

[lib]
name = "sumi_core"
crate-type = ["lib"]

[lints]
workspace = true

[dependencies]
# a plugin's own artwork's draw list, drawn smooth on the CPU
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
sumi-engine = { workspace = true }
sumi-gpu = { workspace = true }
sumi-clip = { path = "../sumi-clip" }
log = { workspace = true }
thiserror = { workspace = true }
# waits for the GPU to say whether the window's surface took its configuration
pollster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
png = { workspace = true }
# the time-lapse's frames, kept as JPEG; a model's textures, PNG or JPEG
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# text laid out and drawn alike in both apps: shaping, wrapping and glyphs, and the outline's stroke
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
swash = "0.2"
# Vertical text a letter (a grapheme: a letter with its marks, an emoji as joined) a line
unicode-segmentation = "1"
parking_lot = { workspace = true }
# A patch's module, interpreted without generating machine code at run time. Portable dispatch
# avoids unbounded native stack growth on long modules.
wasmi = { version = "2", default-features = false, features = ["std", "validate", "stable", "portable-dispatch"] }

[dev-dependencies]
# hostile modules, written out in the tests
wat = "1"
