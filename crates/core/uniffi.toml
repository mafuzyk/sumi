# UniFFI bindings of the `sumi_core` library: Kotlin for the Android app, Swift for the iPad app.

[bindings.kotlin]
package_name = "app.sumi.core"
cdylib_name = "sumi_core"

# The Swift file is compiled into the iPad app; its C half (SumiCoreFFI, a header and a module
# map) is found on the import path ios/build-rust.sh writes.
[bindings.swift]
module_name = "SumiCore"
ffi_module_name = "SumiCoreFFI"
