[package]
name = "clip-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# Its own workspace root: the app workspace depends on it by path, but its sample-dependent tests
# must not join that workspace's `cargo test`/`clippy`/`fmt` runs.
[workspace]

[dependencies]
anyhow = "1"
thiserror = "2"
memmap2 = "0.9"
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
png = "0.17"
rayon = "1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
lcms2 = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts"] }
fontdb = "0.24"
skrifa = "0.44"
tiny-skia = "0.12"
rustybuzz = "0.20"
ttf-parser = "0.25"

[features]
# External CSP sample art under `samples/extracted/`; not tracked in the repository.
corpus = []
