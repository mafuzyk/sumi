[package]
name = "sumi-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Sumi's GPU renderer (wgpu): layer pixels, stroke rendering, compositing and presenting the canvas"

[lints]
workspace = true

[dependencies]
sumi-engine = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

# OpenGL on Windows where neither Vulkan nor Direct3D 12 makes a device (an older GPU or driver)
[target.'cfg(windows)'.dependencies]
wgpu = { workspace = true, features = ["gles"] }

# OpenGL on Linux where Vulkan makes no device (an older GPU or driver)
[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, features = ["gles"] }

# Metal on macOS
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }
